<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=h1, initial-scale=1.0">
  <title>Contoh Atribut, Checkbox & Radio</title>
</head>
<body>
  <h1>Contoh Input Atribut, Checkbox & Radio </h1>

  <form>
    <label for="name">Nama:
      <input type="text" id="name" name="name" placeholder="masukan nama" autocomplete="off" required>
    </label>
    <br>

    <h3>Hobby:</h3>
    <label for="Hobby 1">
      <input type="checkbox" id="Hobby 1" name="hobby" value="Olahraga"> Olahraga
    </label><br>
    <label for="Hobby 2">
      <input type="checkbox" id="Hobby 2" name="hobby" value="Membaca"> Membaca
    </label><br>
    <label for="Hobby 3">
      <input type="checkbox" id="Hobby 3" name="hobby" value="Ngoding"> Ngoding
    </label><br>
   
    <h3>Jenis Kelamin:</h3>
    <label for="Laki-laki">
      <input type="radio" id="Laki-laki" name="Jenis Kelamin" value="Laki-laki"> Laki-laki
      </label><br>
      <label for="Perempuan">
      <input type="radio" id="Perempuan" name="Jenis Kelamin" value="Perempuan"> Perempuan
      </label><br>

    <br>
    <button type="submit">Kirim</button>

  </form>
</body>
</html>
