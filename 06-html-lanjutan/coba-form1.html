<!DOCTYPE html>
<tml lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Element Form</title>
</head>
<body>

  <h1>Contoh element-elemen form pada HTML</h1>

  <form>
    <label for="nama">Nama: </label>
    <input type="text" name="nama" id="nama" placeholder="masukan nama">

    <br>
    <label for="password"> password:
      <input type="password" name="password" id="passwprd">
    </label>
    <br>

    <label for="email">Email: </label>
    <input type="email" name="email" id="email" placeholder="masukan email">
    <br>

    <label for="angka">Angka: 
      <input type="number" name="number" id="number" min="0" max="100">
    </label>
    <br>

    <label for="tanggal">Tanggal: 
      <input type="date" name="tanggal" id="tanggal">
    </label>
     <br>
     
   <label for="warna"> Pilih Warna:
    <input type="color" name="warna" id="warna"> 
     </label>
<br>
     <button type="submit">Kirim</button>

  </form>
</body>
</html>
